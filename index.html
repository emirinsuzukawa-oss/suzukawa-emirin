  <style>

    * {

    html {
      scroll-behavior: smooth;

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;

    }

    main {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 0 100px;
    }


    /* ========================================
       TOP
    ======================================== */

    .top {
      text-align: center;
      margin-bottom: 90px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 1.8rem;
      font-weight: normal;
      letter-spacing: 0.12em;
    }

    .notice {
      margin: 0 0 40px;
      color: #777777;
      font-size: 0.85rem;
    }


    /* ========================================
       LINE
    ======================================== */

    .line-area {
      text-align: center;
      margin-top: 35px;
    }

    .line-title {
      margin-bottom: 15px;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    .line-qr {
      display: block;
      width: 160px;
      height: auto;
      margin: 0 auto;
    }


    /* ========================================
       SECTION
    ======================================== */

    section {
      margin-top: 100px;
    }

    h2 {
      margin: 0 0 35px;
      padding-bottom: 12px;

      border-bottom: 1px solid #dddddd;

      font-size: 1.25rem;
      font-weight: normal;
      letter-spacing: 0.08em;
    }


    /* ========================================
       GOOGLE CALENDAR
    ======================================== */

    .calendar-container {
      position: relative;
      width: 100%;
      overflow: hidden;

      border: 1px solid #eeeeee;
      background: #ffffff;
    }

    .calendar-container iframe {
      display: block;
      width: 100%;
      height: 700px;
      border: 0;
    }


    /* ========================================
       STILL
    ======================================== */

    .still-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px 40px;
    }

    .still-item h3 {
      margin: 0 0 15px;

      font-size: 1rem;
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .still-slider {
      position: relative;

      width: 100%;
      aspect-ratio: 4 / 5;

      overflow: hidden;

      background: #f7f7f7;

      cursor: pointer;
    }

    .still-slider img {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #f7f7f7;

      opacity: 0;

      transition: opacity 0.7s ease;
    }

    .still-slider img.active {
      opacity: 1;
    }


    /* 写真の上にマウスを置いたときの案内 */

    .slide-guide {
      position: absolute;

      left: 50%;
      bottom: 15px;

      transform: translateX(-50%);

      z-index: 10;

      padding: 5px 10px;

      background: rgba(255,255,255,0.75);

      color: #555555;

      font-size: 0.7rem;

      opacity: 0;

      transition: opacity 0.3s;
    }

    .still-slider:hover .slide-guide {
      opacity: 1;
    }


    /* ========================================
       MOVIE
    ======================================== */

    .movie-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .movie-item h3 {
      margin: 0 0 15px;

      font-size: 1rem;
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .movie-coming-soon {
      width: 100%;
      aspect-ratio: 16 / 9;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f7f7f7;

      border: 1px solid #eeeeee;

      color: #777777;

      font-size: 1rem;
      letter-spacing: 0.18em;
    }


    /* ========================================
       FOOTER
    ======================================== */

    footer {
      margin-top: 120px;
      padding-top: 30px;

      border-top: 1px solid #eeeeee;

      text-align: center;

      color: #aaaaaa;

      font-size: 0.75rem;
    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      main {
        width: calc(100% - 30px);
        padding-top: 50px;
      }

      h1 {
        font-size: 1.45rem;
      }

      section {
        margin-top: 70px;
      }

      .calendar-container {
        overflow-x: auto;
      }

      .calendar-container iframe {
        height: 600px;
      }

      .still-grid {
        grid-template-columns: 1fr;
        gap: 55px;
      }

      .movie-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .slide-guide {
        opacity: 1;
      }

    }

  </style>

</head>

<script>

  /* ==========================================
     STILL SLIDESHOW

     PC
     カーソルを合わせる → 自動スライド

     スマホ
     タップ → 開始 / 停止
  =========================================== */

  document.querySelectorAll(".still-slider").forEach(function(slider) {

    const images = slider.querySelectorAll("img");

    let current = 0;
    let timer = null;


    /* 次の写真 */

    function nextImage() {

      images[current].classList.remove("active");

      current++;

      if (current >= images.length) {
        current = 0;
      }

      images[current].classList.add("active");

    }


    /* スライド開始 */

    function startSlider() {

      if (timer !== null) {
        return;
      }

      timer = setInterval(function() {

        nextImage();

      }, 1800);

    }


    /* スライド停止 */

    function stopSlider() {

      if (timer !== null) {

        clearInterval(timer);

        timer = null;

      }

    }


    /* PC */

    slider.addEventListener(
      "mouseenter",
      startSlider
    );

    slider.addEventListener(
      "mouseleave",
      stopSlider
    );


    /* スマートフォン */

    slider.addEventListener(
      "click",
      function() {

        if (timer === null) {

          startSlider();

        } else {

          stopSlider();

        }

      }
    );

  });

</script>
