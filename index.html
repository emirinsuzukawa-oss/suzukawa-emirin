<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <!-- 検索エンジンに掲載しない -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>涼川 笑鈴 | Official Website</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    main {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 70px 0 100px;
    }


    /* =========================
       TOP
    ========================= */

    .top {
      text-align: center;
      margin-bottom: 90px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .notice {
      margin: 0 0 45px;
      color: #777777;
      font-size: 0.85rem;
    }


    /* =========================
       LINE
    ========================= */

    .line-placeholder {
      width: 150px;
      height: 150px;
      margin: 0 auto;

      display: flex;
      justify-content: center;
      align-items: center;

      border: 1px solid #dddddd;

      color: #999999;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }


    /* =========================
       共通
    ========================= */

    section {
      margin-top: 100px;
    }

    h2 {
      margin: 0 0 35px;
      padding-bottom: 12px;

      border-bottom: 1px solid #dddddd;

      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }


    /* =========================
       CALENDAR
    ========================= */

    .calendar-placeholder {
      width: 100%;
      height: 600px;

      display: flex;
      justify-content: center;
      align-items: center;

      border: 1px solid #dddddd;

      color: #999999;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }


    /* =========================
       STILL
    ========================= */

    .still-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px 40px;
    }

    .still-item h3 {
      margin: 0 0 15px;

      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .still-box {
      width: 100%;
      aspect-ratio: 4 / 5;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f7f7f7;
      border: 1px solid #eeeeee;

      color: #999999;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }


    /* =========================
       MOVIE
    ========================= */

    .movie-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .movie-item h3 {
      margin: 0 0 15px;

      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .movie-box {
      width: 100%;
      aspect-ratio: 16 / 9;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f7f7f7;
      border: 1px solid #eeeeee;

      color: #999999;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 120px;
      padding-top: 30px;

      border-top: 1px solid #eeeeee;

      text-align: center;

      color: #aaaaaa;
      font-size: 0.75rem;
    }


    /* =========================
       スマホ
    ========================= */

    @media (max-width: 700px) {

      main {
        width: calc(100% - 30px);
        padding-top: 50px;
      }

      h1 {
        font-size: 1.45rem;
      }

      section {
        margin-top: 70px;
      }

      .calendar-placeholder {
        height: 500px;
      }

      .still-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .movie-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

    }

  </style>

</head>


<body>

<main>


  <!-- =========================
       TOP
  ========================= -->

  <header class="top">

    <h1>関係者専用ページ</h1>

    <p class="notice">
      ※無断転送、転載はしないでください。
    </p>


    <!-- LINE QRをここに入れる -->

    <div class="line-placeholder">
      LINE QR
    </div>

  </header>



  <!-- =========================
       CALENDAR
  ========================= -->

  <section>

    <h2>稼働可能日カレンダー</h2>

    <!-- カレンダーをここに入れる -->

    <div class="calendar-placeholder">
      CALENDAR
    </div>

  </section>



  <!-- =========================
       STILL
  ========================= -->

  <section>

    <h2>Still</h2>

    <div class="still-grid">


      <!-- STILL 1 -->

      <div class="still-item">

        <h3>Still 1</h3>

        <div class="still-box">
          PHOTO
        </div>

      </div>


      <!-- STILL 2 -->

      <div class="still-item">

        <h3>Still 2</h3>

        <div class="still-box">
          PHOTO
        </div>

      </div>


      <!-- STILL 3 -->

      <div class="still-item">

        <h3>Still 3</h3>

        <div class="still-box">
          PHOTO
        </div>

      </div>


      <!-- STILL 4 -->

      <div class="still-item">

        <h3>Still 4</h3>

        <div class="still-box">
          PHOTO
        </div>

      </div>


    </div>

  </section>



  <!-- =========================
       MOVIE
  ========================= -->

  <section>

    <h2>Movie</h2>

    <div class="movie-grid">


      <!-- MOVIE 1 -->

      <div class="movie-item">

        <h3>Movie</h3>

        <div class="movie-box">
          MOVIE
        </div>

      </div>


      <!-- MOVIE 2 -->

      <div class="movie-item">

        <h3>Movie</h3>

        <div class="movie-box">
          MOVIE
        </div>

      </div>


    </div>

  </section>



  <!-- =========================
       FOOTER
  ========================= -->

  <footer>
    © 涼川 笑鈴
  </footer>


</main>

</body>

</html>
