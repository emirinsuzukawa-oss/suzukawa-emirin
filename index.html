<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- 検索エンジンに掲載しない -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>関係者専用ページ | 涼川 笑鈴</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, "Helvetica Neue", "Noto Sans JP", sans-serif;
    }

    main {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    /* ================================
       TOP
    ================================= */

    .top {
      text-align: center;
      margin-bottom: 80px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .notice {
      margin: 0 0 40px;
      color: #777777;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    /* ================================
       LINE QR
    ================================= */

    .line-area {
      margin-top: 35px;
    }

    .line-qr {
      display: block;
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin: 0 auto;
    }

    .line-text {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #777777;
      letter-spacing: 0.08em;
    }

    /* ================================
       SECTION
    ================================= */

    section {
      margin-top: 100px;
    }

    .section-title {
      margin: 0 0 35px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dddddd;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    /* ================================
       CALENDAR
    ================================= */

    .calendar-wrap {
      width: 100%;
      overflow: hidden;
    }

    .calendar-wrap iframe {
      width: 100%;
      height: 650px;
      border: 0;
    }

    /* ================================
       STILL
    ================================= */

    .still-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 70px 40px;
    }

    .still-item h3 {
      margin: 0 0 15px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .still-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #f4f4f4;
      cursor: pointer;
    }

    .still-slider img {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      transition: opacity 0.7s ease;
    }

    .still-slider img.active {
      opacity: 1;
    }

    /* ================================
       MOVIE
    ================================= */

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }

    .movie-item h3 {
      margin: 0 0 15px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .movie-item video {
      display: block;
      width: 100%;
      background: #000000;
    }

    /* YouTube等を使う場合 */

    .movie-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000000;
    }

    .movie-frame iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }

    /* ================================
       FOOTER
    ================================= */

    footer {
      margin-top: 120px;
      padding-top: 30px;
      border-top: 1px solid #eeeeee;

      text-align: center;
      color: #999999;

      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 700px) {

      main {
        width: min(100% - 30px, 1100px);
        padding-top: 50px;
      }

      h1 {
        font-size: 1.5rem;
      }

      section {
        margin-top: 70px;
      }

      .calendar-wrap iframe {
        height: 550px;
      }

      .still-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .movie-grid {
        grid-template-columns: 1fr;
        gap: 50px;
      }

    }

  </style>
</head>


<body>

<main>

  <!-- ========================================
       TOP
  ========================================= -->

  <header class="top">

    <h1>関係者専用ページ</h1>

    <p class="notice">
      ※無断転送、転載はしないでください。
    </p>


    <!-- ======================================
         LINE QR

         ↓ line-qr.png を
         自分のLINE QR画像に差し替える
    ======================================= -->

    <div class="line-area">

      <img
        src="line-qr.png"
        alt="LINE QRコード"
        class="line-qr"
      >

    </div>

  </header>


  <!-- ========================================
       CALENDAR
  ========================================= -->

  <section>

    <h2 class="section-title">
      稼働可能日カレンダー
    </h2>

    <div class="calendar-wrap">

      <!--
        ↓ Googleカレンダーの
        埋め込みURLに差し替える
      -->

      <iframe
        src="ここにGoogleカレンダーの埋め込みURL"
        loading="lazy">
      </iframe>

    </div>

  </section>


  <!-- ========================================
       STILL
  ========================================= -->

  <section>

    <h2 class="section-title">
      Still
    </h2>


    <div class="still-grid">


      <!-- ============================
           STILL 01
      ============================= -->

      <div class="still-item">

        <h3>Still 01</h3>

        <div class="still-slider">

          <img
            src="still1-1.jpg"
            alt="Still 01"
            class="active"
          >

          <img
            src="still1-2.jpg"
            alt="Still 01"
          >

          <img
            src="still1-3.jpg"
            alt="Still 01"
          >

          <img
            src="still1-4.jpg"
            alt="Still 01"
          >

        </div>

      </div>


      <!-- ============================
           STILL 02
      ============================= -->

      <div class="still-item">

        <h3>Still 02</h3>

        <div class="still-slider">

          <img
            src="still2-1.jpg"
            alt="Still 02"
            class="active"
          >

          <img
            src="still2-2.jpg"
            alt="Still 02"
          >

          <img
            src="still2-3.jpg"
            alt="Still 02"
          >

          <img
            src="still2-4.jpg"
            alt="Still 02"
          >

        </div>

      </div>


      <!-- ============================
           STILL 03
      ============================= -->

      <div class="still-item">

        <h3>Still 03</h3>

        <div class="still-slider">

          <img
            src="still3-1.jpg"
            alt="Still 03"
            class="active"
          >

          <img
            src="still3-2.jpg"
            alt="Still 03"
          >

          <img
            src="still3-3.jpg"
            alt="Still 03"
          >

          <img
            src="still3-4.jpg"
            alt="Still 03"
          >

        </div>

      </div>


      <!-- ============================
           STILL 04
      ============================= -->

      <div class="still-item">

        <h3>Still 04</h3>

        <div class="still-slider">

          <img
            src="still4-1.jpg"
            alt="Still 04"
            class="active"
          >

          <img
            src="still4-2.jpg"
            alt="Still 04"
          >

          <img
            src="still4-3.jpg"
            alt="Still 04"
          >

          <img
            src="still4-4.jpg"
            alt="Still 04"
          >

        </div>

      </div>


    </div>

  </section>


  <!-- ========================================
       MOVIE
  ========================================= -->

  <section>

    <h2 class="section-title">
      Movie
    </h2>


    <div class="movie-grid">


      <!-- ============================
           MOVIE 01

           movie1.mp4 を差し替える
      ============================= -->

      <div class="movie-item">

        <h3>Movie 01</h3>

        <video
          controls
          playsinline
          preload="metadata">

          <source
            src="movie1.mp4"
            type="video/mp4"
          >

          お使いのブラウザでは動画を再生できません。

        </video>

      </div>


      <!-- ============================
           MOVIE 02

           movie2.mp4 を差し替える
      ============================= -->

      <div class="movie-item">

        <h3>Movie 02</h3>

        <video
          controls
          playsinline
          preload="metadata">

          <source
            src="movie2.mp4"
            type="video/mp4"
          >

          お使いのブラウザでは動画を再生できません。

        </video>

      </div>


    </div>

  </section>


  <!-- ========================================
       FOOTER
  ========================================= -->

  <footer>

    © 涼川 笑鈴

  </footer>


</main>


<script>

  /* ==========================================
     STILL SLIDESHOW

     PC
     → カーソルを合わせるとスライド開始

     スマートフォン
     → タップするとスライド開始
  =========================================== */


  document.querySelectorAll(".still-slider").forEach(function(slider) {

    const images = slider.querySelectorAll("img");

    let current = 0;

    let timer = null;


    /* ----------------------------------------
       次の写真
    ----------------------------------------- */

    function nextImage() {

      images[current].classList.remove("active");

      current++;

      if (current >= images.length) {
        current = 0;
      }

      images[current].classList.add("active");

    }


    /* ----------------------------------------
       スライド開始
    ----------------------------------------- */

    function startSlider() {

      if (timer !== null) {
        return;
      }

      timer = setInterval(function() {

        nextImage();

      }, 1800);

    }


    /* ----------------------------------------
       スライド停止
    ----------------------------------------- */

    function stopSlider() {

      if (timer !== null) {

        clearInterval(timer);

        timer = null;

      }

    }


    /* ----------------------------------------
       PC
    ----------------------------------------- */

    slider.addEventListener(
      "mouseenter",
      startSlider
    );


    slider.addEventListener(
      "mouseleave",
      stopSlider
    );


    /* ----------------------------------------
       スマートフォン
    ----------------------------------------- */

    slider.addEventListener(
      "click",
      function() {

        if (timer === null) {

          startSlider();

        } else {

          stopSlider();

        }

      }
    );

  });

</script>


</body>
</html>
